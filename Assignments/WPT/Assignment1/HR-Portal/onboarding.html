<html>
    <head>
        <title>Onboarding Page</title>
        <link rel="stylesheet" type="text/css" href="style-hr.css">

    </head>
    <body class="obp-body">
        <h1 class="obp-h1">Onboarding Page</h1>
        <section class="obp-section">

            <div class="obp-d1"> 
    
                <form a="https://www.google.com" method="post" class="obp-f">
                    <label for="full-name">Full Name: </label>
                    <input type="text" placeholder="Donald Trump">
                    <br><br>
                    <label for="email">Official email: </label>
                    <input type="email" placeholder="trump@gmail.com">
                    <br><br>
                    <label>Temporary password</label>
                    <input type="password">
                    <br><br>
                    <label>Date of birth:</label>
                    <input type="date">
                    <br><br>
                    <label>Joining Date:</label>
                    <input type="date">
                    <br><br>
                    <label>Orientation Slot:</label>
                    <input type="date">
                    <br><br>
                    <label>Reporting Time:</label>
                    <input type="time">
                    <br><br>
                    <label>Gender:</label>
                    <input type="radio" value="gender"><label>Male</label>
                    <input type="radio" value="gender"><label>Female</label>
                    <br><br>
                    <label>Highest Qualification</label>
                    <select>
                        <option>--</option>
                        <option value="q1">M.E</option>
                        <option value="q2">B.E</option>
                        <option value="q3">MBA</option>
                        <option value="q4">B.Arch</option>
                    </select>
                    <br><br>
                    <label>Department</label>
                    <select>
                        <option>--</option>
                        <option value="d1">SWE</option>
                        <option value="d2">System Engineer</option>
                        <option value="d3">HR</option>
                        <option value="d4">finance</option>
                    </select>
                    <br><br>
                    <label>Current Address:</label>
                    <textarea placeholder="Write address"></textarea>
                    <br><br>
                    <label>Passport photo or Resume</label>
                    <input type="file">
                    <br><br>
                    <label>Declaration</label>
                    <input type="checkbox"><label>I'm Confirming the Information.</label>
                    <br><br>
                    <label>Submit:</label>
                    <button type="submit">Submit</button>
                    <br><br>
                    <label>Reset form:</label>
                    <button type="reset">Reset</button>
                    <br><br>
                    <label>Need Help?</label>
                    <button type="button">Get Help</button>
                    <br><br>
        
                    
                    
                    
                    
                </form>
            </div>

        </section>
