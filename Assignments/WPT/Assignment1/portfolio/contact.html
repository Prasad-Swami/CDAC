<html>
    <head>
        <title>
            Contact Page
        </title>
        <link rel="stylesheet" type="text/css" href="style.css">

    </head>
    <body>
        <form action="https://www.google.com" method="post">
            <label>Name :</label>
            <input type="text" placeholder="Joe" required>
            <br>
            <br>
            <label>Email :</label>
            <input type="email" placeholder="xyz@gmail.com" required>
            <br>
            <br>
            <label>Preferred Contact Date :</label required>
            <input type="date">
            <br>
            <br>
            <label>Enquiry Type</label>
            <input type="radio"><label>Name</label>
            <input type="radio"><label>Message</label>
            <input type="radio"><label>CV file</label>
            <br>
            <label>Select the file</label>
            <input type="file" placeholder="select">
            <br>
            <br>
            <button type="submit">Submit the form</button>
            <br>
            <br>
            <button type="reset">Reset the filled Details</button>
        </form>
    </body>
</html>
